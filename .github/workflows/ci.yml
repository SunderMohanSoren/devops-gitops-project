
name: Flask CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test application endpoints
        run: |
          python -c "from app import app; client = app.test_client(); assert client.get('/').status_code == 200; assert client.get('/health').status_code == 200; print('Both endpoints passed')"
